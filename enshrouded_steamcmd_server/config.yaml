name: Enshrouded Dedicated Server (SteamCMD + Wine)
slug: enshrouded_steamcmd_server
version: "1.1.0"
description: Enshrouded server with persistent worlds and automatic updates on startup
arch:
  - amd64
startup: application
boot: auto
init: false
timeout: 120
host_network: false
ports:
  15637/udp: 15637
ports_description:
  15637/udp: Enshrouded query and game traffic
map:
  - share:rw
options:
  server_name: Enshrouded Home Server
  server_password: ""
  slots: 8
  update_on_start: true
  auto_update: false
  update_check_minutes: 30
  update_idle_minutes: 5
schema:
  server_name: str
  server_password: password
  slots: int(1,16)
  update_on_start: bool
  auto_update: bool
  update_check_minutes: int(5,1440)
  update_idle_minutes: int(1,60)
